<header class="fixed top-3 sm:top-6 left-1/2 -translate-x-1/2 w-[96%] sm:w-[92%] max-w-6xl z-40">
    <div class="glass-panel rounded-2xl px-2 xs:px-3 sm:px-6 py-2 sm:py-3.5 flex items-center justify-between shadow-sm">
        <!-- Logo -->
        <a href="/" onclick="navigateTo('home'); return false;"
            class="font-display font-extrabold text-base xs:text-lg sm:text-2xl tracking-tight text-neutral-900 flex items-center gap-0.5 sm:gap-1 group shrink-0">
            <span class="text-base xs:text-lg sm:text-2xl transition-transform duration-300 group-hover:rotate-12 group-hover:scale-110">🍀</span>
            <span class="tracking-tighter">myduy</span><span class="text-rose-500 font-extrabold text-base xs:text-lg sm:text-2xl inline-block group-hover:scale-125 transition-transform duration-300">.</span>
        </a>

        <!-- Nav Links -->
        <nav class="flex items-center gap-0.5 xs:gap-1.5 sm:gap-6 md:gap-8 shrink">
            <button onclick="navigateTo('home')"
                class="nav-link text-[9.5px] xs:text-[11px] sm:text-xs font-medium uppercase tracking-wider transition-colors active"
                data-target="home">Home</button>
            <button onclick="navigateTo('projects')"
                class="nav-link text-[9.5px] xs:text-[11px] sm:text-xs font-medium uppercase tracking-wider transition-colors"
                data-target="projects">Projects</button>
            <button onclick="navigateTo('journey')"
                class="nav-link text-[9.5px] xs:text-[11px] sm:text-xs font-medium uppercase tracking-wider transition-colors"
                data-target="journey">Journey</button>
            <button onclick="navigateTo('skills')"
                class="nav-link text-[9.5px] xs:text-[11px] sm:text-xs font-medium uppercase tracking-wider transition-colors"
                data-target="skills">Skills</button>
        </nav>

        <!-- Actions / CV & Thesis Buttons -->
        <div class="flex items-center gap-1 sm:gap-3 shrink-0">
            <a id="btn-thesis" href="/KLTN.pdf" target="_blank"
                class="hidden sm:inline-flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-neutral-800 bg-neutral-100 hover:bg-neutral-200 border border-neutral-300/80 rounded-lg transition-all shadow-sm">
                <span>Thesis</span>
                <iconify-icon icon="lucide:file-text" width="12"></iconify-icon>
            </a>
            <a id="btn-cv" href="/CV_MaiNhatDuy_AI_Engineering.pdf" target="_blank"
                class="inline-flex items-center gap-1 px-2 xs:px-2.5 sm:px-3.5 py-1 xs:py-1.5 sm:py-2 text-[10px] xs:text-[11px] sm:text-xs font-semibold text-white bg-[#111111] hover:bg-neutral-800 rounded-lg transition-all shadow-sm">
                <span>CV</span>
                <iconify-icon icon="lucide:arrow-up-right" width="11"></iconify-icon>
            </a>
        </div>
    </div>
</header>
